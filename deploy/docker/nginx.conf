# nginx for the Why Flux container: runs as the unprivileged nginx user on 8080 and writes only to /tmp,
# so the container also works with a read-only root filesystem. TLS is terminated in front of it (on Flux,
# by the network's shared HTTPS routing). Headers and caching match deploy/whyflux.stache.beer.conf.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints everything under /assets/, so those files can be cached forever; everything else
    # (index.html, art, the network snapshot) is revalidated on each visit so a redeploy shows at once.
    map $uri $whyflux_cache_control {
        ~^/assets/  "public, max-age=31536000, immutable";
        default     "no-cache";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;

        # Headers live at server level only: an add_header inside a location would drop these.
        # connect-src: the live network numbers come straight from the public Flux APIs.
        add_header Cache-Control $whyflux_cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.runonflux.io https://stats.runonflux.io; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'none'; object-src 'none'" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
