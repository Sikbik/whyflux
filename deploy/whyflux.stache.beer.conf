# Why Flux: static site (Vite build) in /var/www/whyflux/html.
# Installed as /etc/nginx/sites-enabled/whyflux.stache.beer by deploy/deploy.sh.

# Vite fingerprints everything under /assets/, so those files can be cached forever; everything else
# (index.html, art, the network snapshot) is revalidated on each visit so a redeploy shows at once.
map $uri $whyflux_cache_control {
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "no-cache";
}

# Plain HTTP: answer Let's Encrypt challenges, send everything else to HTTPS.
server {
  listen 80;
  listen [::]:80;
  server_name whyflux.stache.beer;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name whyflux.stache.beer;

  ssl_certificate /etc/letsencrypt/live/whyflux.stache.beer/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/whyflux.stache.beer/privkey.pem;
  include snippets/tls.conf;

  root /var/www/whyflux/html;
  index index.html;

  # Headers live at server level only: an add_header inside a location would drop these (and HSTS from tls.conf).
  # connect-src: the live network numbers come straight from the public Flux APIs.
  add_header Cache-Control $whyflux_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.runonflux.io https://stats.runonflux.io; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'none'; object-src 'none'" always;

  location ~ /\. {
    deny all;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
